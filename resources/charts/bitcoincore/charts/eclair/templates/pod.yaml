apiVersion: v1
kind: Pod
metadata:
  name: {{ include "eclair.fullname" . }}
  labels:
    {{- include "eclair.labels" . | nindent 4 }}
    {{- with .Values.podLabels }}
        {{- toYaml . | nindent 4 }}
    {{- end }}
    app: {{ include "eclair.fullname" . }}
    {{- if .Values.collectLogs }}
    collect_logs: "true"
    {{- end }}
    chain: {{ .Values.global.chain }}
  annotations:
    kubectl.kubernetes.io/default-container: "eclair"
spec:
  restartPolicy: "{{ .Values.restartPolicy }}"
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: {{ .Chart.Name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      ports:
        - name: p2p
          containerPort: {{ .Values.P2PPort }}
          protocol: TCP
        - name: rest
          containerPort: {{ .Values.RestPort }}
          protocol: TCP
      command:
        - /bin/bash
        - -c
        - |
          # Eclair has no internal wallet, it funds channels from a Bitcoin Core wallet.
          # Make sure that wallet exists and is loaded before starting eclair.
          rpc() {
            curl --silent --user user:{{ .Values.global.rpcpassword }} \
              --data-binary "{\"jsonrpc\":\"1.0\",\"id\":\"warnet\",\"method\":\"$1\",\"params\":$2}" \
              http://{{ include "bitcoincore.fullname" . }}:{{ index .Values.global .Values.global.chain "RPCPort" }}/
          }
          until rpc listwallets '[]' | grep -q '"eclair"'; do
            echo "Waiting for bitcoind wallet 'eclair'..."
            rpc createwallet '["eclair"]' > /dev/null
            rpc loadwallet '["eclair"]' > /dev/null
            sleep 2
          done
          exec /app/eclair-node/bin/eclair-node.sh -Declair.datadir=/root/.eclair -Declair.printToConsole
      livenessProbe:
        {{- toYaml .Values.livenessProbe | nindent 8 }}
      readinessProbe:
        {{- toYaml .Values.readinessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.startupProbe | nindent 8 }}
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      volumeMounts:
        {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        - mountPath: /root/.eclair/eclair.conf
          name: config
          subPath: eclair.conf
        - mountPath: /root/.eclair
          name: eclair-data
    {{- with .Values.extraContainers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  volumes:
    {{- with .Values.volumes }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    - configMap:
        name: {{ include "eclair.fullname" . }}
      name: config
    - name: eclair-data
      {{- if .Values.persistence.enabled }}
      {{- if .Values.persistence.existingClaim }}
      persistentVolumeClaim:
        claimName: {{ .Values.persistence.existingClaim }}
      {{- else }}
      persistentVolumeClaim:
        claimName: {{ include "eclair.fullname" . }}.{{ .Release.Namespace }}-eclair-data
      {{- end }}
      {{- else }}
      emptyDir: {}
      {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
